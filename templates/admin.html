<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,sans-serif;background:#080c14;color:#eee}</style></head>
<body class="min-h-screen p-4 md:p-8"><div class="max-w-6xl mx-auto">
<div class="flex justify-between items-center mb-8"><div><h1 class="text-3xl font-bold">پنل مدیریت</h1><p class="text-slate-400 text-sm mt-1">کاربران، سفارش‌ها و پیام‌ها</p></div><a href="/" class="bg-slate-800 px-4 py-2 rounded-xl">بازگشت به سایت</a></div>
<div id="msg" class="mb-4 text-sky-300"></div>
<section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6"><h2 class="font-bold mb-4">پیام همگانی</h2><div class="flex gap-2"><input id="broadcast" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3" placeholder="پیام برای همه کاربران"><button onclick="broadcastMsg()" class="bg-indigo-500 px-5 rounded-xl">ارسال</button></div></section>
<section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6"><h2 class="font-bold mb-4">کاربران</h2><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 border-b border-slate-800"><th class="p-3">کاربر</th><th>کل</th><th>مصرف</th><th>باقی</th><th>روز</th><th>پیام</th><th>ذخیره</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold mb-4">سفارش‌ها</h2><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 border-b border-slate-800"><th class="p-3">شماره</th><th>کاربر</th><th>بسته</th><th>قیمت</th><th>وضعیت</th><th>ثبت</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</div><script>
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=await r.json();if(!r.ok)throw Error(d.message||'خطا');return d}
async function load(){try{let us=await api('/api/admin/users');users.innerHTML=us.map(u=>`<tr class="border-b border-slate-800"><td class="p-3">${u.username}</td><td><input id="t${u.id}" value="${u.total}" class="w-20 bg-slate-950 p-2 rounded"></td><td><input id="u${u.id}" value="${u.used}" class="w-20 bg-slate-950 p-2 rounded"></td><td>${u.remaining}</td><td><input id="d${u.id}" value="${u.days_left}" class="w-16 bg-slate-950 p-2 rounded"></td><td><button onclick="send(${u.id})" class="text-sky-400">پیام</button></td><td><button onclick="save(${u.id})" class="bg-emerald-500/10 text-emerald-300 px-3 py-2 rounded">ذخیره</button></td></tr>`).join('');let os=await api('/api/admin/orders');orders.innerHTML=os.map(o=>`<tr class="border-b border-slate-800"><td class="p-3">${o.id}</td><td>${o.username}</td><td>${o.package}</td><td>${o.price.toLocaleString()}</td><td><select onchange="status(${o.id},this.value)" class="bg-slate-950 p-2 rounded"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='paid'?'selected':''}>paid</option><option ${o.status==='completed'?'selected':''}>completed</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td><td class="text-xs text-slate-400">${new Date(o.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')}catch(e){alert(e.message);location.href='/'}} 
async function save(id){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({total_gb:+document.getElementById('t'+id).value,used_gb:+document.getElementById('u'+id).value,days_left:+document.getElementById('d'+id).value})});load()}
async function send(id){let t=prompt('پیام برای این کاربر:');if(t)await api('/api/admin/users/'+id+'/message',{method:'POST',body:JSON.stringify({text:t})})}
async function broadcastMsg(){let t=broadcast.value.trim();if(!t)return;let d=await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({text:t})});broadcast.value='';msg.innerText='پیام برای '+d.count+' کاربر ارسال شد.'}
async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:s})})}
load();
</script></body></html>
